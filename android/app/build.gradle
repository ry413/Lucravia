plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def envProperties = new Properties()
def envFile = rootProject.file("../.env")
if (envFile.exists()) {
    envFile.withReader("UTF-8") { reader -> envProperties.load(reader) }
}
def vlmServerUrl = envProperties.getProperty("VLM_SERVER_URL", "").trim()
if ((vlmServerUrl.startsWith('"') && vlmServerUrl.endsWith('"')) ||
        (vlmServerUrl.startsWith("'") && vlmServerUrl.endsWith("'"))) {
    vlmServerUrl = vlmServerUrl.substring(1, vlmServerUrl.length() - 1)
}
def escapedVlmServerUrl = vlmServerUrl
        .replace("\\", "\\\\")
        .replace('"', '\\"')
def sharedSecret = envProperties.getProperty("SHARED_SECRET", "").trim()
if ((sharedSecret.startsWith('"') && sharedSecret.endsWith('"')) ||
        (sharedSecret.startsWith("'") && sharedSecret.endsWith("'"))) {
    sharedSecret = sharedSecret.substring(1, sharedSecret.length() - 1)
}
def escapedSharedSecret = sharedSecret
        .replace("\\", "\\\\")
        .replace('"', '\\"')

android {
    namespace = "com.cheatcat.cheat_cat"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.cheatcat.cheat_cat"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "String", "VLM_SERVER_URL", "\"${escapedVlmServerUrl}\""
        buildConfigField "String", "SHARED_SECRET", "\"${escapedSharedSecret}\""
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

flutter {
    source = "../.."
}
