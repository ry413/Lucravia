plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def envProperties = new Properties()
def envFile = rootProject.file("../.env")
if (envFile.exists()) {
    envFile.withReader("UTF-8") { reader -> envProperties.load(reader) }
}
def vlmServerUrl = envProperties.getProperty("VLM_SERVER_URL", "").trim()
if ((vlmServerUrl.startsWith('"') && vlmServerUrl.endsWith('"')) ||
        (vlmServerUrl.startsWith("'") && vlmServerUrl.endsWith("'"))) {
    vlmServerUrl = vlmServerUrl.substring(1, vlmServerUrl.length() - 1)
}
def escapedVlmServerUrl = vlmServerUrl
        .replace("\\", "\\\\")
        .replace('"', '\\"')
def sharedSecret = envProperties.getProperty("SHARED_SECRET", "").trim()
if ((sharedSecret.startsWith('"') && sharedSecret.endsWith('"')) ||
        (sharedSecret.startsWith("'") && sharedSecret.endsWith("'"))) {
    sharedSecret = sharedSecret.substring(1, sharedSecret.length() - 1)
}
def escapedSharedSecret = sharedSecret
        .replace("\\", "\\\\")
        .replace('"', '\\"')
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}

android {
    namespace = "com.cheatcat.cheat_cat"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    defaultConfig {
        applicationId = "com.lucravia.xiaozhuiot"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "String", "VLM_SERVER_URL", "\"${escapedVlmServerUrl}\""
        buildConfigField "String", "SHARED_SECRET", "\"${escapedSharedSecret}\""
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { task ->
        task.name in ["assembleRelease", "bundleRelease", "packageRelease"]
    }
    if (buildsRelease && !hasReleaseSigning) {
        throw new GradleException(
                "缺少永久 Release 签名：请恢复 android/key.properties 和 " +
                        "android/app/lucravia-release.jks，绝不能生成新签名。")
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

flutter {
    source = "../.."
}
